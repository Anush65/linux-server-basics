<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployGuard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .health {
            background: #064e3b;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        main {
            width: 86%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .hero {
            margin-bottom: 30px;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #667085;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .card h3 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 13px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: #f8fafc;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .app {
            border: 1px solid #e4e7ec;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .app-name {
            font-weight: bold;
            font-size: 17px;
        }

        .running {
            color: #059669;
            font-weight: bold;
            font-size: 13px;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
        }

        @media(max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>DeployGuard</h1>
    <div class="health">● System Healthy</div>
</header>

<main>

    <section class="hero">
        <h2>Cloud-Native Application Deployment</h2>
        <p>Register applications, store deployment information and monitor your infrastructure.</p>
    </section>

    <div class="grid">

        <section class="card">
            <h3>Deploy an Application</h3>

            <form id="applicationForm">

                <label>Application Name</label>
                <input id="name" placeholder="My Portfolio" required>

                <label>Developer Name</label>
                <input id="developer" placeholder="Anush" required>

                <label>Email</label>
                <input id="email" type="email" placeholder="anush@example.com" required>

                <label>Repository / Application URL</label>
                <input id="repository" placeholder="https://github.com/user/project">

                <label>Application Type</label>
                <select id="type">
                    <option>Web Application</option>
                    <option>REST API</option>
                    <option>Mobile Backend</option>
                    <option>Other</option>
                </select>

                <button type="submit">Register Application</button>

                <div id="message" class="message"></div>

            </form>
        </section>

        <section class="card">
            <h3>Deployment Dashboard</h3>

            <div class="stats">
                <div class="stat">
                    <strong id="total">0</strong>
                    Applications
                </div>

                <div class="stat">
                    <strong id="running">0</strong>
                    Running
                </div>

                <div class="stat">
                    <strong>100%</strong>
                    Health
                </div>
            </div>

            <h3>Registered Applications</h3>

            <div id="applications">
                Loading...
            </div>

        </section>

    </div>

</main>

<script>
async function loadApplications() {
    try {
        const response = await fetch("/applications");
        const apps = await response.json();

        document.getElementById("total").textContent = apps.length;
        document.getElementById("running").textContent =
            apps.filter(a => a.status === "Running").length;

        const container = document.getElementById("applications");

        if (apps.length === 0) {
            container.innerHTML = "<p>No applications registered yet.</p>";
            return;
        }

        container.innerHTML = apps.map(app => `
            <div class="app">
                <div class="app-name">${app.name}</div>
                <div>${app.repository || "No repository provided"}</div>
                <div class="running">● ${app.status}</div>
            </div>
        `).join("");

    } catch (error) {
        document.getElementById("applications").innerHTML =
            "<p>Unable to connect to backend.</p>";
    }
}

document.getElementById("applicationForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        developer: document.getElementById("developer").value,
        email: document.getElementById("email").value,
        repository: document.getElementById("repository").value,
        type: document.getElementById("type").value
    };

    try {
        const response = await fetch("/applications", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        const message = document.getElementById("message");
        message.style.display = "block";

        if (response.ok) {
            message.textContent = "Application registered successfully.";
            message.style.background = "#dcfce7";
            message.style.color = "#166534";

            e.target.reset();
            loadApplications();
        } else {
            message.textContent = result.error || "Something went wrong.";
        }

    } catch (error) {
        alert("Backend connection failed.");
    }
});

loadApplications();
</script>

</body>
</html>
